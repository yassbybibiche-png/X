# Récupère les binaires tiers épinglés dans scripts/deps.lock.json, vérifie
# taille + SHA-256 et met le dossier en cache. Clé = hash du manifeste + OS :
# tant que le manifeste ne change pas, rien n'est retéléchargé (le cache est
# réutilisé par release.yml et smoke.yml). Jamais déclenché par un simple push.
name: Binaires tiers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # chaque lundi : garde le cache chaud (éviction après 7 jours sans accès)
  push:
    branches: [main, master]
    paths: ["scripts/deps.lock.json", "scripts/fetch_deps.py"]

permissions:
  contents: read

jobs:
  fetch:
    name: deps ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-15-intel, platform: macos-x64 }
          - { os: macos-latest, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps/dl
          key: deps-${{ matrix.platform }}-${{ hashFiles('scripts/deps.lock.json') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger et vérifier (fichiers déjà en cache ignorés)
        run: python scripts/fetch_deps.py --platform ${{ matrix.platform }} --dest deps/dl
      - name: Contenu
        shell: bash
        run: ls -la deps/dl
